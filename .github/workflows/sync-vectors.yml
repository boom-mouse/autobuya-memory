name: sync-vectors

on:
  push:
    paths:
      - 'cases/**'
      - 'schema/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync vectors
        env:
          VECTOR_BACKEND: ${{ vars.VECTOR_BACKEND }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGVECTOR_TABLE: ${{ vars.PGVECTOR_TABLE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_API_BASE: ${{ secrets.EMBEDDING_API_BASE }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            node bin/sync-vectors.mjs --since "${{ github.event.before }}"
          else
            node bin/sync-vectors.mjs --all
          fi
